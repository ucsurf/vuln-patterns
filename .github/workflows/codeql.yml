name: CodeQL
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"
permissions:
  contents: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@b1722c1245f90604c2c348f9d1624af97ea8fc6e  # v3.29.0
        with:
          # the repo has no application code; scan the GitHub Actions workflows
          languages: actions
      - uses: github/codeql-action/analyze@b1722c1245f90604c2c348f9d1624af97ea8fc6e  # v3.29.0
