name: Rules
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"
      - run: pip install semgrep==1.183.0 yamllint
      - name: yamllint
        run: yamllint -c .yamllint.yml rules/ .github/
      - name: Validate rules
        run: semgrep --validate --metrics=off --config rules/
      - name: Test rules
        run: semgrep --test rules/
      - name: Demo input still produces a finding
        run: |
          if semgrep --config rules/ docs/demo/app.py --metrics=off --quiet --error; then
            echo "demo produced no findings"; exit 1
          fi
      - name: Every rule has docs and >=2 ruleid / >=1 ok cases
        run: |
          fail=0
          for y in $(find rules -name '*.yaml'); do
            id=$(sed -n 's/^- id: //p' "$y")
            t=$(ls "${y%.yaml}".* | grep -v '\.yaml$')
            [ -f "docs/$id.md" ] || { echo "missing docs/$id.md"; fail=1; }
            [ "$(grep -c "ruleid: $id" "$t")" -ge 2 ] || { echo "$id: <2 ruleid"; fail=1; }
            [ "$(grep -c "ok: $id" "$t")" -ge 1 ] || { echo "$id: no ok case"; fail=1; }
          done
          exit $fail
